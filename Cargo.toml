[package]
name = "lynxx-cli"
version = "0.9.0"
edition = "2021"
license = "Proprietary"
description = "Declarative CLI for the Lynxx gateway"

# Lint policy. See ../gateway.lynxx.vexarr.com/Cargo.toml for the rationale
# pattern — clap-derived subcommand handlers naturally take many args.
[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[[bin]]
name = "lynxx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
dirs = "5"
hmac = "0.12"
jsonwebtoken = "9"
openapiv3 = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "fs"] }
toml = "0.8"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
